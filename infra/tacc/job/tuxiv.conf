entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: flatjai-e3
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=4
    - time=00:55:00
    - output=${TACC_SLURM_USERLOG}/flatjai-e3-%j.log

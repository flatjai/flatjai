# SearXNG for FlatJai: local only, JSON API on, limiter off (the only client is our backend).
use_default_settings: true
server:
  secret_key: "flatjai-local-only-not-a-secret"
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  formats: [html, json]
# Yahoo honours "site:" queries. Brave, DuckDuckGo and Google CSE rate-limit or CAPTCHA a busy local
# instance, after which every site-restricted query returned nothing (seen 2026-11-18).
engines:
  - name: yahoo
    disabled: false

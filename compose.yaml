services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: flatjai
      POSTGRES_PASSWORD: flatjai
      POSTGRES_DB: flatjai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flatjai"]
      interval: 2s
      retries: 20
volumes:
  pgdata:

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: flatjai
      POSTGRES_PASSWORD: flatjai
      POSTGRES_DB: flatjai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flatjai"]
      interval: 2s
      retries: 20

  searxng:   # free meta search, no API key; JSON at http://localhost:8888/search?q=...&format=json
    image: searxng/searxng:2026.11.15-2d500cb6b
    ports: ["8888:8080"]
    volumes: ["./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 3s
      retries: 20

  otp:   # OpenTripPlanner: real bus, minibus and MTR journeys (build the graph first: make otp-graph)
    image: opentripplanner/opentripplanner:2.10.0
    profiles: [otp]
    command: ["--load", "--serve"]
    ports: ["8080:8080"]
    volumes: ["./deploy/otp/data:/var/opentripplanner"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx3g"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]  # no wget or curl in the image
      interval: 5s
      retries: 60

  grafana:   # observability dashboard on http://localhost:3001 (load its data first: make obs)
    image: grafana/grafana:12.0.0
    ports: ["3001:3000"]
    depends_on: [postgres]
    volumes:
      - "./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # local only: open without a login, as a viewer
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flatjai.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 3s
      retries: 30

volumes:
  pgdata:

# FlatJai query suite: 20 reviewed cases plus 30 drafts (status: draft) in 7 categories.
#
# turns:    what the student types, in order (a second turn answers a question or refines).
# truth:    the student's hard limits as WE read the brief. The scorer checks every shortlisted home
#           against these with its own code, not against the agent's own checks.
#             budget        max monthly rent in HK$ (the student's share when `share` > 1)
#             share         people splitting the rent (a budget for the whole flat: share 1, budget = total)
#             campus        HKUST | HKU | CUHK | CityU | PolyU
#             commute_max   minutes, one way
#             room          room | flat (a whole unit; a studio is a flat) | any
#             bedrooms_min  for a whole flat
# expect:
#   ask_first   true: the first turn must be a question (missing info), false: must not ask
#   min_items   at least this many homes after the last turn (0 for infeasible briefs)
#   relaxations true: an empty answer must propose concrete relaxations
#   profile     fields the parsed profile must have after the last turn

cases:
  # --- standard (6) ---------------------------------------------------------------------------
  - id: std-hkust-own-room-9k
    category: standard
    turns: ["Own room, max HK$9,000 a month, under 40 min to HKUST, from January, quiet"]
    truth: {budget: 9000, campus: HKUST, commute_max: 40, room: room}
    expect: {ask_first: false, min_items: 1, profile: {budget_hkd_month: 9000, campus: HKUST, room_only: true}}

  - id: std-hkust-2bed-30k-total
    category: standard
    turns: ["2-bedroom flat to share with a friend, 30k budget total, under 40 min to HKUST, move in February"]
    truth: {budget: 30000, campus: HKUST, commute_max: 40, room: flat, bedrooms_min: 2}
    expect: {ask_first: false, min_items: 1, profile: {budget_hkd_month: 30000, budget_is_total: true, campus: HKUST}}

  - id: std-hku-studio-15k
    category: standard
    turns: ["Studio near HKU, up to 15k, 30 minutes to campus, from 1 March"]
    truth: {budget: 15000, campus: HKU, commute_max: 30, room: flat}
    expect: {ask_first: false, min_items: 1, profile: {budget_hkd_month: 15000, campus: HKU}}

  - id: std-cityu-room-7k
    category: standard
    turns: ["Room near CityU, budget 7,000 per month, max 35 minutes commute"]
    truth: {budget: 7000, campus: CityU, commute_max: 35, room: room}
    expect: {ask_first: false, min_items: 1, profile: {budget_hkd_month: 7000, campus: CityU, room_only: true}}

  - id: std-cuhk-room-6k
    category: standard
    turns: ["Single room for a CUHK student, under HK$6,000, within 30 min of campus"]
    truth: {budget: 6000, campus: CUHK, commute_max: 30, room: room}
    expect: {ask_first: false, min_items: 1, profile: {budget_hkd_month: 6000, campus: CUHK, room_only: true}}

  - id: std-polyu-1bed-18k
    category: standard
    turns: ["1-bedroom flat for one, PolyU, up to 18k a month, no more than 30 minutes away"]
    truth: {budget: 18000, campus: PolyU, commute_max: 30, room: flat, bedrooms_min: 1}
    expect: {ask_first: false, min_items: 1, profile: {budget_hkd_month: 18000, campus: PolyU, room_only: false}}

  # --- missing info (3): one useful question, then continue ------------------------------------
  - id: miss-cheap-room
    category: missing_info
    turns: ["cheap room please", "HKUST, around 8000 a month"]
    truth: {budget: 8000, campus: HKUST, room: room}
    expect: {ask_first: true, min_items: 1, profile: {budget_hkd_month: 8000, campus: HKUST}}

  - id: miss-2bed-near-campus
    category: missing_info
    turns: ["2-bedroom flat to share with a friend near campus, move in February", "HKU, 28k total"]
    truth: {budget: 28000, campus: HKU, room: flat, bedrooms_min: 2}
    expect: {ask_first: true, min_items: 1, profile: {campus: HKU, budget_hkd_month: 28000}}

  - id: miss-flat-budget-only
    category: missing_info
    turns: ["Looking for a place, max 12k", "Near CityU please, a studio is fine"]
    truth: {budget: 12000, campus: CityU, room: flat}
    expect: {ask_first: true, min_items: 1, profile: {budget_hkd_month: 12000, campus: CityU}}

  # --- infeasible (3): say nothing fits, propose relaxations, invent nothing --------------------
  - id: inf-hku-2bed-8k
    category: infeasible
    turns: ["2-bedroom flat within 15 minutes of HKU for HK$8,000 total"]
    truth: {budget: 8000, campus: HKU, commute_max: 15, room: flat, bedrooms_min: 2}
    expect: {ask_first: false, min_items: 0, relaxations: true}

  - id: inf-hkust-studio-4k
    category: infeasible
    turns: ["Studio under 10 minutes from HKUST, max 4,000 a month"]
